generated: '2026-09-19'
method: probed
source: >-
  GET on each of the four paid resources documented at
  https://docs.itsgloria.ai/gloria-data-platform/x402-integration/ on 2026-09-19, without an
  X-PAYMENT header (no payment was made). Prices cross-checked against the docs table.
summary: >-
  Every paid resource Gloria documents answers a REAL x402 challenge: HTTP 402, Content-Type
  application/json, a body carrying the x402Version 1 envelope ("X-PAYMENT header is required")
  with one accepts[] entry - scheme exact, network base, USDC (0x8335...2913), a fixed payTo
  address, maxTimeoutSeconds 60 - and an outputSchema block that describes the resource's HTTP
  method, queryParams (name, type, description, required) and the JSON shape of the paid response.
  That block is a provider-published machine-readable contract for the x402 surface, saved
  verbatim in the challenge files rather than re-authored. The probe hit the documented operation
  paths, not the base URL (the base URL answers 200 {"message":"It works."}); unknown paths on the
  same host return a clean 404, so the 402s are resource-specific and not a catch-all. /articles on
  this host answers 401 "Missing x-api-key header" and is not part of the x402 surface.

  version: 1
  headers_observed: [content-type, x-powered-by, x-frame-options, x-content-type-options, x-xss-protection, referrer-policy, content-security-policy, cf-cache-status]
  payment_required_header: absent (v1 envelope is in the body only; no PAYMENT-REQUIRED / X-PAYMENT-REQUIRED response header)
  rate_limit_headers_observed: []

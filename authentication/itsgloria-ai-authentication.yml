flows:
- name: SIWE wallet sign-in (EIP-4361)
  steps:
  - 'GET /auth/nonce -> {"nonce": "..."} (getNonce, no auth)'
  - sign an EIP-4361 message containing the nonce with an Ethereum wallet
  - 'POST /auth/verify {"message", "signature"} -> {"access_token": "<jwt>", "is_admin": false} (verifySignature)'
  - use the JWT as Bearer or ?token=
  docs: https://docs.itsgloria.ai/gloria-data-platform/api-integration/#wallet-authentication
- name: API token (recommended by the docs)
  steps:
  - 'authenticate once (SIWE), then POST /user/api-tokens {"name", "allowed_feed_categories"} (createApiToken) - or generate in the browser at https://www.itsgloria.ai/api-keys-new'
  - the ApiToken carries token, issued_at, expires_at and is scoped to the chosen feed categories for life
  - GET /user/api-tokens lists, DELETE /user/api-tokens revokes
  docs: https://docs.itsgloria.ai/gloria-data-platform/api-integration/#api-token-recommended
- name: Public token (anonymous, read-only)
  steps:
  - 'GET /auth/public-token -> {"access_token": {"name": "Auth", "allowed_feed_categories": "[]", "token": "<jwt>"}} (getPublicToken)'
  - roles ["public"], no feed permissions; observed to read GET /news on 2026-09-19
  docs: https://docs.itsgloria.ai/gloria-data-platform/api-integration/#public-token
permissions:
  model: feed-category scoping - each token carries allowed_feed_categories; a request for another category answers 403 Forbidden
  categories: 19 codes from GET /available-feed-categories

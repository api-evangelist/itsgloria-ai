aid: itsgloria-ai
name: Gloria
description: >-
  Gloria (Gloria AI Ltd., a Crypto Briefing product) is an AI-powered crypto and prediction-market
  news intelligence platform: a real-time feed of curated headlines scraped from crypto Twitter and
  newswires, filtered by a multi-stage LLM pipeline and enriched with sentiment, entity extraction,
  narratives, category recaps and long-form articles. The same data core is exposed four ways - a
  20-operation REST API (OpenAPI 3.0.3 at itsgloria.ai/openapi.json, base https://ai-hub.cryptobriefing.com)
  authenticated by SIWE wallet signature or long-lived API tokens, a WebSocket push feed, a hosted
  MCP server at mcp.itsgloria.ai with seven tools that answers an anonymous tools/list, and an x402
  pay-per-request API at api.itsgloria.ai settled in USDC on Base - plus Telegram and Discord bots.

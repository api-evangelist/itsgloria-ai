apis:
- name: Gloria Data Platform REST API
  aid: itsgloria-ai:gloria-data-platform-rest-api
  description: >-
    REST API for curated crypto news with sentiment analysis, per-category AI recaps, narrative
    story arcs, long-form articles and feed categories, plus API-token and social-bot management.
    Authentication is a JWT obtained by SIWE (EIP-4361) wallet signature, a long-lived API token
    generated at itsgloria.ai/api-keys-new, or an anonymous public token; the token is passed as a
    Bearer header or a ?token= query parameter. 20 operations across 16 paths, published as
    OpenAPI 3.0.3 at https://www.itsgloria.ai/openapi.json. The base URL the docs publish is
    https://ai-hub.cryptobriefing.com (the spec's own servers[] host, ai.gloriaterminal.com, does
    not resolve; every documented path was verified live on the ai-hub host).
  humanURL: https://docs.itsgloria.ai/gloria-data-platform/api-integration/
  baseURL: https://ai-hub.cryptobriefing.com

- name: Gloria x402 API
  aid: itsgloria-ai:gloria-x402-api
  description: >-
    Pay-per-request access to Gloria news over the x402 protocol with no account or API key: GET
    /news ($0.03), /news-ticker-summary ($0.031), /news-by-keyword ($0.05) and /recaps ($0.10),
    each answering an HTTP 402 x402Version 1 challenge (scheme exact, USDC on Base, 60 s timeout)
    whose body carries a machine-readable input/output description of the paid resource. All four
    documented resources were probed live on 2026-09-19 and returned genuine challenges; no
    payment was made.
  humanURL: https://docs.itsgloria.ai/gloria-data-platform/x402-integration/
  baseURL: https://api.itsgloria.ai
  tags:
  - x402
  - Micropayments
  - News
  - Crypto
  - Agents
  properties:
  - type: Documentation
    url: https://docs.itsgloria.ai/gloria-data-platform/x402-integration/
  - type: X-X402
    url: x402/itsgloria-ai-x402.yml
- name: Gloria MCP Server
  aid: itsgloria-ai:gloria-mcp-server
  description: >-
    Hosted, remote MCP server (Streamable HTTP at https://mcp.itsgloria.ai/mcp, serverInfo "Gloria
    AI" 1.26.0, protocol 2025-06-18) exposing seven tools - five free (get_latest_news,
    get_news_recap, search_news, get_categories, get_news_item) and two that return x402 payment
    instructions (get_enriched_news, get_ticker_summary) - plus two resources (gloria://about,
    gloria://categories). initialize and tools/list answer anonymously. The same server ships as
    the open-source gloria-mcp package on PyPI for local stdio use against the REST API with a
    GLORIA_API_TOKEN.
  humanURL: https://www.itsgloria.ai/mcp
  baseURL: https://mcp.itsgloria.ai/mcp
  tags:
  - MCP
  - Agents
  - News
  - Crypto
  - x402

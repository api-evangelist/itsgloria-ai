generated: '2026-09-19'
method: probed
status: published
source: >-
  Live JSON-RPC probe of https://mcp.itsgloria.ai/mcp on 2026-09-19 (initialize -> notifications/initialized
  -> tools/list, prompts/list, resources/list, all 200 with no credentials), cross-checked against the
  provider's MCP page https://www.itsgloria.ai/mcp, the PyPI package gloria-mcp 1.0.0 and its source at
  https://github.com/cryptobriefing-labs/gloria-mcp.
deployment:
  mode: both
  endpoint: https://mcp.itsgloria.ai/mcp
  transport: streamable-http
  install: "uv run gloria-mcp"
  package: https://pypi.org/project/gloria-mcp/
  auth: none
  verified: probed
  notes: >-
    The remote endpoint requires the standard Streamable HTTP session flow - initialize returns an
    mcp-session-id header that every later call must echo (a bare tools/list answers 400 "Missing
    session ID"; GET with Accept text/event-stream answers 400 as well). The www.itsgloria.ai/mcp page
    tells Claude Desktop / Claude Code / Cursor users to connect via
    `npx -y @anthropic-ai/mcp-remote https://mcp.itsgloria.ai/sse`, but /sse answered 404 to both GET
    and POST on 2026-09-19; the working transport is Streamable HTTP at /mcp. The stdio package needs
    GLORIA_API_TOKEN (an API token from itsgloria.ai/api-keys-new) and calls the REST base
    AI_HUB_BASE_URL (default https://ai-hub.cryptobriefing.com); the hosted endpoint needs nothing for
    the five free tools. The two paid tools do not call the resource - they return x402 payment
    instructions for api.itsgloria.ai (see x402/itsgloria-ai-x402.yml).
server:
  name: Gloria AI
  version: 1.26.0
  protocolVersion: '2025-06-18'
  transport: http
  url: https://mcp.itsgloria.ai/mcp
  advertised_sse_url: https://mcp.itsgloria.ai/sse
  advertised_sse_status: 404
  capabilities:
    tools: {listChanged: false}
    resources: {subscribe: false, listChanged: false}
    prompts: {listChanged: false}
  instructions: >-
    Real-time curated crypto news from Gloria AI. Covers 18 categories including Bitcoin, Ethereum,
    DeFi, AI, Solana, and more. News is sourced from crypto Twitter, filtered by AI for relevance, and
    enriched with sentiment analysis and entity extraction. Use get_categories to discover available
    topics, then get_latest_news or get_news_recap for data. Paid tools return x402 payment instructions.
  clients_listed: [Claude Desktop, Claude Code, Cursor, Windsurf, ChatGPT, Any MCP Client]
  license: MIT (gloria-mcp repository)
auth:
  methods: [none]
  paid_tools: x402 (USDC on Base) - the tool returns payment instructions for the api.itsgloria.ai resource
  stdio_env: [GLORIA_API_TOKEN, AI_HUB_BASE_URL]
tool_count: 7
tools_list_file: itsgloria-ai-tools-list.json
resources_list_file: itsgloria-ai-resources-list.json
tools:
- name: get_latest_news
  category: news
  tier: free
  description: Get the latest curated crypto news headlines with sentiment, categories and sources; filter by category code.
  inputSchema: {category: 'string|null (default null)', limit: 'integer (default 5, clamped 1-10)'}
  source_operation: openapi/itsgloria-ai-openapi.yml#getNews
- name: get_news_recap
  category: recaps
  tier: free
  description: AI-generated news recap for a category and timeframe.
  inputSchema: {category: 'string (required)', timeframe: "string (default '12h')"}
  source_operation: openapi/itsgloria-ai-openapi.yml#getRecaps
- name: search_news
  category: news
  tier: free
  description: Search curated crypto news by keyword.
  inputSchema: {query: 'string (required)', limit: 'integer (default 5, clamped 1-5)'}
  source_operation: openapi/itsgloria-ai-openapi.yml#getNews
- name: get_categories
  category: categories
  tier: free
  description: List all available news categories with their recap timeframes.
  inputSchema: {}
  source_operation: openapi/itsgloria-ai-openapi.yml#getAvailableFeedCategories
- name: get_news_item
  category: news
  tier: free
  description: Get a specific news item by its ID (free-tier fields).
  inputSchema: {id: 'string (required)'}
  source_operation: openapi/itsgloria-ai-openapi.yml#getNewsById
- name: get_enriched_news
  category: news
  tier: x402
  description: Enriched news with full AI-generated context and entity analysis; returns x402 payment instructions (USDC on Base).
  inputSchema: {}
  x402_resource: https://api.itsgloria.ai/news
- name: get_ticker_summary
  category: recaps
  tier: x402
  description: 24-hour AI-generated summary for any crypto ticker or topic; returns x402 payment instructions.
  inputSchema: {}
  x402_resource: https://api.itsgloria.ai/news-ticker-summary
resources:
- uri: gloria://about
  name: about
  mimeType: text/plain
  description: About Gloria AI and its data coverage.
- uri: gloria://categories
  name: categories_resource
  mimeType: text/plain
  description: Current feed categories with descriptions.
prompts: []

purpose: >-
  Make each MCP tool a first-class discovery unit bound to its backing REST operation, so the tool's
  real input contract is the operation's parameters in the OpenAPI. Gloria's MCP surface is a strict
  subset of the REST surface for reads (5 of 20 operations), and the two paid tools are projections
  of the x402 surface on api.itsgloria.ai rather than of the authenticated REST base.

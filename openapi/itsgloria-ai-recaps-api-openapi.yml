openapi: 3.2.0
info:
  title: Gloria Terminal Recaps API
  version: 1.0.0
  description: AI-powered crypto intelligence API providing real-time news with sentiment analysis, market narratives, category recaps, and articles.
  contact:
    name: Gloria Terminal
    url: https://itsgloria.ai
servers:
- url: https://ai.gloriaterminal.com
  description: Production
security:
- BearerAuth: []
- TokenQuery: []
tags:
- name: Recaps
  description: Periodic summaries per feed category
paths:
  /recaps:
    get:
      operationId: getRecaps
      tags:
      - Recaps
      summary: Get a category recap
      description: Returns an AI-generated summary of recent news for a feed category and timeframe.
      parameters:
      - name: feed_category
        in: query
        required: true
        description: Feed category code (e.g. `crypto`, `macro`, `defi`)
        schema:
          type: string
      - name: timeframe
        in: query
        required: true
        description: Recap timeframe (e.g. `12h`, `24h`, `8h`)
        schema:
          type: string
      responses:
        '200':
          description: Category recap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recap'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          description: Error message
    Recap:
      type: object
      required:
      - feed_category
      - timeframe
      - recap
      - created_at
      properties:
        feed_category:
          type: string
          description: Category code
        timeframe:
          type: string
          description: Recap timeframe (e.g. 12h, 24h)
        recap:
          type: string
          description: AI-generated recap text
        created_at:
          type: string
          format: date-time
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from `/auth/verify` or `/user/api-tokens`.
    TokenQuery:
      type: apiKey
      in: query
      name: token
      description: JWT token passed as a query parameter. Equivalent to `BearerAuth`.
